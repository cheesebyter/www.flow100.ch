# flow100.ch - statische Seite im Container (nginx-unprivileged, Port 8080).
# TLS terminiert nginx auf Darlene, Traefik auf Delphi routet per HTTP hierher.
# www.flow100.ch -> flow100.ch leitet Darlene per 301 um (redirect_domains in
# apps.yml), nicht dieser Container.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    charset utf-8;
    server_tokens off;

    # Security-Header. Bewusst nur hier auf Server-Ebene: ein add_header in
    # einer location wuerde diese Header dort verdraengen (nginx erbt nicht).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Saubere URLs: eine kanonische Adresse pro Seite.
    absolute_redirect off;
    if ($request_uri ~ "^/index\.html(?:\?|$)") { return 301 /$is_args$args; }

    # Health-Check fuer Docker/Ansible (kein Log-Rauschen)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        expires -1;   # Cache-Control: no-cache, damit Aenderungen sofort sichtbar sind
        try_files $uri $uri/index.html =404;
    }

    location /assets/ {
        expires 7d;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
