# Build-Workflow fuer flow100.ch (INF-080), Vorlage:
# FLOW100_Infrastructure/vps-management/docs/templates/app-repo/container.yml
#
# Pro Push auf master: ghcr.io/cheesebyter/www.flow100.ch:sha-<7 Zeichen>.
# Kein Deploy-Schritt - ausgerollt wird vom Controller (app update flow100),
# nachdem der Tag in apps.yml im Infra-Repo steht.

name: Container

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Delphi ist x86_64 (laut INF-080 noch einmal mit "uname -m" pruefen).
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag fuer apps.yml
        run: |
          echo "### Fester Tag fuer apps.yml" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`tag: \"sha-${GITHUB_SHA::7}\"\`" >> "$GITHUB_STEP_SUMMARY"
